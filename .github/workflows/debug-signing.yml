# Throwaway probe: confirm the updater signing key and its password match.
# This repository is public, so every line below must stay value-free: report
# booleans only, never the password, its length, or a hash of it.
# Delete this workflow once signing is green.
name: debug-signing

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe updater signing
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "key_secret_nonempty: $([ -n "${KEY_B64:-}" ] && echo true || echo false)"
          echo "password_secret_nonempty: $([ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ] && echo true || echo false)"

          printf '%s' "$KEY_B64" | base64 -d > /tmp/updater.key
          head -c 32 /dev/urandom > /tmp/payload.bin
          rm -f /tmp/payload.bin.sig

          export TAURI_SIGNING_PRIVATE_KEY="$(cat /tmp/updater.key)"
          npx --yes @tauri-apps/cli@2 signer sign /tmp/payload.bin > /dev/null 2>&1 || true

          if [ -f /tmp/payload.bin.sig ]; then
            echo "SIGN: PASS"
            # Bytes are little-endian relative to the hex in the key's own comment.
            echo "signature_key_id_le: $(tail -n 1 /tmp/payload.bin.sig | base64 -d | xxd -p -s 2 -l 8 | tr 'a-f' 'A-F')"
          else
            echo "SIGN: FAIL"
            exit 1
          fi
