name: Main Snapshot

on:
  workflow_dispatch:
  push:
    branches: [gpui]

permissions:
  contents: read

concurrency:
  group: main-snapshot
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
  SNAPSHOT_TAG: main-snapshot

jobs:
  prepare:
    name: Resolve and test main
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      main_sha: ${{ steps.metadata.outputs.main_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve main commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/gpui | awk '{print $1}')"
          [[ -n "${main_sha}" ]] || { echo 'failed to resolve gpui' >&2; exit 1; }
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify build configuration
        env:
          NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
        shell: bash
        run: |
          if [[ -z "${NYATERM_GITHUB_GIST_CLIENT_ID:-}" ]]; then
            echo 'NYATERM_GITHUB_GIST_CLIENT_ID repository variable is required' >&2
            exit 1
          fi

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: main-snapshot-preflight
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Prepare Android native dependencies
        shell: bash
        run: |
          python3 scripts/release/prepare_android.py
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          target = subprocess.check_output(['rustc', '-vV'], text=True).split('host: ')[1].splitlines()[0]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FFMPEG_DIR={(Path("target/android-deps/ffmpeg") / target).resolve()}\n')
          PY
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test packaging and release helpers
        run: python scripts/ci/test_scripts.py
      - name: Check workflow syntax
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          rhysd/actionlint:1.7.7

  package:
    name: Package ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { label: windows-arm64, os: windows-2025, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.main_sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package request
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.main_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          sha = os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha) or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha:
              raise SystemExit('package source must be the frozen checkout SHA')
          version = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          if version != os.environ['VERSION']:
              raise SystemExit('invalid package version')
          PY
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: main-snapshot-${{ matrix.target }}
          cache-on-failure: 'true'
          save-cache: always
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/ci/install-nsis.ps1
      - name: Prepare bundled ConPTY
        run: python scripts/release/prepare_conpty.py
      - name: Package native application (Windows MSVC)
        shell: pwsh
        env:
          NYATERM_ARTIFACT_VERSION: main-snapshot
          NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
          NYATERM_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          # Git Bash prepends Git's /usr/bin/link.exe, shadowing MSVC's linker.
          # Preserve the PATH configured by ilammy/msvc-dev-cmd for Rust builds.
          $linker = (Get-Command link.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if ($linker -notmatch '\\VC\\Tools\\MSVC\\[^\\]+\\bin\\HostX64\\(x64|arm64)\\link\.exe$') {
            throw "Expected Visual Studio MSVC linker, got: $linker"
          }
          Write-Host "Using MSVC linker: $linker"
          python scripts/release/package_native.py "$env:TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows version information
        shell: pwsh
        run: >-
          pwsh scripts/ci/verify-version.ps1
          -ExePath target/native-package/NyaTerm-portable/NyaTerm.exe
          -ExpectedCompany rangerhou -ExpectedProduct NyaTerm
      - name: Verify native package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python scripts/release/verify_native_package.py
          --target "${TARGET}" --version "${VERSION}"
          --artifact-version main-snapshot --dist dist
      # Run host tests even when the package contains ARM64 executables.
      - name: Configure MSVC for host tests
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Test portable updater against packaged ZIP
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $arch = if ($env:TARGET -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          $env:NYATERM_TEST_PORTABLE_ARCH = if ($arch -eq 'arm64') { 'aarch64' } else { 'x86_64' }
          $env:NYATERM_TEST_PORTABLE_ARCHIVE = (Resolve-Path "dist/NyaTerm_main-snapshot_windows_${arch}_portable.zip").Path
          cargo test -p nyaterm-updater --lib --locked portable_release_archive_round_trip -- --ignored
      - name: Record package provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.main_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/release').resolve()))
          import release_provenance
          target = os.environ['TARGET']
          value = release_provenance.record_v2(
              Path('dist'), target, os.environ['SOURCE_SHA'], os.environ['VERSION'],
              os.environ['GITHUB_RUN_ID'], artifact_version='main-snapshot',
              compiler=subprocess.check_output(['rustc', '-Vv'], text=True).strip(),
          )
          records = Path('provenance')
          records.mkdir(exist_ok=True)
          (records / f'{target}-native.json').write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload package provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ matrix.label }}
          path: provenance/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-snapshot-${{ matrix.label }}
          path: dist/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish main snapshot
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.main_sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: main-snapshot-*
          path: release-assets
          merge-multiple: true
      - name: Validate snapshot assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 scripts/ci/check_release_assets.py --dist release-assets
          --version "${VERSION}" --artifact-version main-snapshot
      - name: Download package provenance
        uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          path: provenance
          merge-multiple: true
      - name: Verify snapshot provenance
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/release').resolve()))
          import package_native
          import release_provenance
          records = Path('provenance')
          expected_records = {f'{target}-native.json' for target in package_native.CI_TARGETS}
          if {path.name for path in records.iterdir()} != expected_records:
              raise SystemExit('incomplete or unexpected Windows snapshot provenance')
          for target in package_native.CI_TARGETS:
              actual = json.loads((records / f'{target}-native.json').read_text(encoding='utf-8'))
              expected = release_provenance.record_v2(
                  Path('release-assets'), target, os.environ['SOURCE_SHA'], os.environ['VERSION'],
                  os.environ['GITHUB_RUN_ID'], artifact_version='main-snapshot',
                  compiler=actual.get('compiler', ''),
              )
              if actual != expected:
                  raise SystemExit(f'snapshot provenance mismatch for {target}')
          PY
      - name: Back up current snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: python scripts/release/snapshot_release.py backup --source-sha "$SOURCE_SHA"
      - name: Retain snapshot preimage before replacing assets
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-preimage-${{ github.run_attempt }}
          path: snapshot-recovery/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/snapshot_release.py publish
      - name: Retain snapshot recovery journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-recovery-${{ github.run_attempt }}
          path: snapshot-recovery/
          if-no-files-found: warn
          retention-days: 7
